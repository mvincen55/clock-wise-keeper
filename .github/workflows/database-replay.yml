name: Database and edge release gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/**'
      - 'scripts/verify-migration-files.mjs'
      - 'scripts/verify-release-db.sql'
      - 'scripts/verify-workflow-safety.mjs'
      - 'scripts/insurance-operations/**'
      - 'src/integrations/supabase/types.ts'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/**'
      - 'scripts/verify-migration-files.mjs'
      - 'scripts/verify-release-db.sql'
      - 'scripts/verify-workflow-safety.mjs'
      - 'scripts/insurance-operations/**'
      - 'src/integrations/supabase/types.ts'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-structure:
    name: Release structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject duplicate migration versions
        run: node scripts/verify-migration-files.mjs

      - name: Reject repository-writing workflows
        run: node scripts/verify-workflow-safety.mjs

  migration-replay:
    name: Replay every migration from zero
    needs: release-structure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start a fresh local Supabase database
        run: supabase db start

      - name: Destroy and replay the full migration chain
        run: supabase db reset --local

      - name: Verify release permissions and scheduled jobs
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/verify-release-db.sql

      - name: Verify live PTO calculations in a disposable database
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pto_probes'
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/pto_probes' -v ON_ERROR_STOP=1 -f supabase/tests/live_pto_probes.sql

      - name: Verify manager schedule authorization in a disposable database
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE schedule_probes'
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/schedule_probes' -v ON_ERROR_STOP=1 -f supabase/tests/employee_schedule_probes.sql

      - name: Verify the tardy approval policy in a disposable database
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tardy_probes'
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/tardy_probes' -v ON_ERROR_STOP=1 -f supabase/tests/tardy_approval_probes.sql

      - name: Verify the attendance engine's tardy cleanup in a disposable database
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE engine_probes'
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/engine_probes' -v ON_ERROR_STOP=1 -f supabase/tests/attendance_engine_probes.sql

      - name: Verify generated insurance database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/insurance-database-types.ts
          node scripts/insurance-operations/verify-generated-types.mjs /tmp/insurance-database-types.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  edge-function-check:
    name: Typecheck every edge function
    needs: release-structure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned to the version that produced the committed deno.lock, so
          # resolution never chases a just-published release (the minimum-
          # dependency-age policy refuses those and fails the job).
          deno-version: v2.9.4

      - name: Deno check all function entry points
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            deno check --node-modules-dir=auto "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
